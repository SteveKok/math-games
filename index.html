<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>思维小游戏 · Think &amp; Play</title>
  <meta name="description" content="Free, open-source math-thinking games for kids aged 8–12. No accounts, no tracking.">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
  <header class="topbar">
    <span style="flex:1"></span>
    <button class="icon-btn" data-lang-next data-i18n-aria="langNext"></button>
    <button class="icon-btn toggle" data-sound-toggle data-i18n-aria="sound"></button>
  </header>

  <main class="hub">
    <h1 data-i18n="siteTitle">思维小游戏</h1>
    <p class="sub" data-i18n="siteSub">先玩，先试，自己发现秘诀</p>

    <div class="cards">
      <a class="card" href="pigeon.html">
        <div class="art" id="pigeon-art"></div>
        <h2 data-i18n="gamePigeon">鸽子与糖果</h2>
        <p data-i18n="gamePigeonDesc">放得下吗？一定会撞吗？</p>
        <span class="tag" data-i18n="play">开始玩</span>
      </a>
      <a class="card" href="cut.html">
        <div class="art" id="cut-art"></div>
        <h2 data-i18n="gameCut">公平切蛋糕</h2>
        <p data-i18n="gameCutDesc">一刀，切成一样大的两块</p>
        <span class="tag" data-i18n="play">开始玩</span>
      </a>
      <a class="card" href="digit.html">
        <div class="art" id="digit-art"><div class="odo"><span>4</span><span class="nine">9</span><span class="nine">9</span><span class="nine">9</span><span class="nine">9</span></div><b class="odo-arrow">+1</b><div class="odo"><span class="plus">5</span><span class="zero">0</span><span class="zero">0</span><span class="zero">0</span><span class="zero">0</span></div></div>
        <h2 data-i18n="gameDigit">加一的秘密</h2>
        <p data-i18n="gameDigitDesc">加 1 以后，数字和会怎么变？</p>
        <span class="tag" data-i18n="play">开始玩</span>
      </a>
      <a class="card" href="right.html">
        <div class="art" id="right-art"><svg viewBox="0 0 120 100" aria-hidden="true"><polygon points="64,60 40,42 58,18 82,36" fill="#c9f2dc" stroke="#1d2433" stroke-width="2"/><polygon points="40,60 40,42 22,42 22,60" fill="#cfe0ff" stroke="#1d2433" stroke-width="2"/><polygon points="40,60 64,60 64,84 40,84" fill="#ffd6dc" stroke="#1d2433" stroke-width="2"/><polygon points="40,60 64,60 40,42" fill="#fff" stroke="#1d2433" stroke-width="2.5" stroke-linejoin="round"/><path d="M40 55 H45 V60" fill="none" stroke="#e63946" stroke-width="2"/><text x="100" y="66" font-size="16" font-weight="900" text-anchor="middle" fill="#e63946">90°</text></svg></div>
        <h2 data-i18n="gameRight">找直角</h2>
        <p data-i18n="gameRightDesc">拼正方形、找直角、算周长</p>
        <span class="tag" data-i18n="play">开始玩</span>
      </a>
      <div class="card soon">
        <h2 data-i18n="comingSoon">快做好了</h2>
        <p data-i18n="noGamesYet">新游戏正在路上……</p>
      </div>
    </div>

    <p class="footer" data-i18n="footer">免费 · 开源 · 不收集任何信息</p>
  </main>

  <script src="js/core.js?v=16"></script>
  <script src="js/strings.js?v=16"></script>
  <script src="js/pigeon-skins.js?v=16"></script>
  <script>
    (function () {
      var sk = MG.PIGEON_ART;
      document.getElementById('pigeon-art').innerHTML =
        '<div class="hub-nest">' + sk.item(0) + sk.item(1) + sk.box(true) + '</div>' +
        '<div class="hub-nest">' + sk.item(2) + sk.box(false) + '</div>';
      document.getElementById('cut-art').innerHTML =
        '<svg viewBox="0 0 120 100" aria-hidden="true"><defs><clipPath id="hl"><path d="M0 0H120L0 100Z"/></clipPath></defs>' +
        '<path d="M12 14H108V86H12Z M44 34L70 28L76 54L50 60Z" fill="#ff9fb0" fill-rule="evenodd" stroke="#1d2433" stroke-width="3"/>' +
        '<path d="M12 14H108V86H12Z M44 34L70 28L76 54L50 60Z" fill="#7cc3ff" fill-rule="evenodd" clip-path="url(#hl)"/>' +
        '<path d="M12 14H108V86H12Z M44 34L70 28L76 54L50 60Z" fill="none" stroke="#1d2433" stroke-width="3"/>' +
        '<path d="M2 98L118 2" stroke="#e63946" stroke-width="4" stroke-linecap="round"/></svg>';
      MG.setupTopbar();
    })();
  </script>
</body>
</html>
