<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>一笔画与涂地图 · One Stroke &amp; Map Colouring</title>
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="index.html" data-icon="home" data-i18n-aria="home"></a>
    <button class="icon-btn" id="btn-levels" data-icon="grid" data-i18n-aria="levels"></button>
    <div class="title" id="level-title"></div>
    <button class="icon-btn" id="btn-skin" data-i18n-aria="skin"></button>
    <button class="icon-btn" data-lang-next data-i18n-aria="langNext"></button>
    <button class="icon-btn toggle" data-sound-toggle data-i18n-aria="sound"></button>
  </header>

  <main class="game graph-game">
    <div class="ask-row">
      <h1 class="ask" id="ask"></h1>
      <button class="icon-btn" id="btn-rules" data-icon="help" data-i18n-aria="rules"></button>
    </div>

    <div class="gboard" id="gboard">
      <svg id="gsvg" class="gsvg" role="img"></svg>
    </div>

    <div class="liar-bar graph-bar">
      <p class="status" id="status" aria-live="polite"></p>
      <div class="palette" id="palette" role="group"></div>
      <div class="liar-actions">
        <button class="icon-btn toggle" id="btn-count" data-icon="glasses" data-i18n-aria="gcount" aria-pressed="false" hidden></button>
        <button class="icon-btn" id="btn-hint" data-icon="bulb" data-i18n-aria="hint" hidden></button>
        <button class="icon-btn" id="btn-undo" data-icon="undo" data-i18n-aria="gundo"></button>
        <button class="icon-btn" id="btn-restart" data-icon="replay" data-i18n-aria="grestart"></button>
        <button class="big-btn secondary" id="btn-impossible" hidden><span data-icon="nope"></span><span data-i18n="gimpossible"></span></button>
      </div>
    </div>
  </main>

  <dialog id="dlg-win">
    <div class="face" id="win-face"></div>
    <h2 data-i18n="youWin"></h2>
    <p class="tip" id="win-tip"></p>
    <div class="actions">
      <button class="big-btn secondary" id="win-again"><span data-icon="replay"></span><span data-i18n="again"></span></button>
      <button class="big-btn" id="win-math" hidden><span data-icon="book"></span><span data-i18n="mathTitle"></span></button>
      <button class="big-btn" id="win-next"><span data-icon="next"></span><span data-i18n="nextLevel"></span></button>
    </div>
  </dialog>

  <dialog id="dlg-levels">
    <h2 data-i18n="levels"></h2>
    <div id="levels-body"></div>
    <div class="skin-row" id="skin-row"></div>
    <div class="actions">
      <button class="big-btn secondary" id="levels-math" hidden><span data-icon="book"></span><span data-i18n="mathTitle"></span></button>
      <button class="big-btn secondary" data-close data-i18n="close"></button>
    </div>
  </dialog>

  <dialog id="dlg-rules" class="rules">
    <h2 data-i18n="rulesTitle"></h2>
    <ol class="rules-list" id="rules-list"></ol>
    <h3 data-i18n="gHowTitle"></h3>
    <p id="rules-how"></p>
    <div class="actions"><button class="big-btn" data-close data-i18n="rulesOk"></button></div>
  </dialog>

  <dialog id="dlg-math" class="math">
    <h2 data-i18n="mathTitle"></h2>
    <div id="math-body"></div>
    <div class="actions"><button class="big-btn" data-close data-i18n="close"></button></div>
  </dialog>

  <script src="js/core.js?v=7"></script>
  <script src="js/strings.js?v=7"></script>
  <script src="js/fx.js?v=7"></script>
  <script src="js/graph-logic.js?v=7"></script>
  <script src="js/graph-skins.js?v=7"></script>
  <script src="js/graph-game.js?v=7"></script>
</body>
</html>
